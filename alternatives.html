<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>البدائل التربوية — ZAHRAA™ Teacher Decision Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --bg:#fbfaf7;
      --surface:#ffffff;
      --surface-soft:#f7f3ec;
      --ink:#2f261f;
      --ink-soft:#776b60;
      --line:#e8dfd3;
      --gold:#b99146;
      --gold-soft:#f5ecd8;
      --gold-line:#e5d3a6;
      --brown:#4a3024;
      --brown-2:#684636;
      --success:#406b51;
      --success-bg:#eef6f1;
      --error:#934d3d;
      --error-bg:#fff1ed;
      --shadow:0 14px 40px rgba(55,42,30,.07);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:"Alexandria",sans-serif;
      background:
        radial-gradient(circle at top right,rgba(185,145,70,.07),transparent 28%),
        var(--bg);
      color:var(--ink);
      min-height:100vh;
      line-height:1.75;
    }

    button,
    input,
    textarea,
    select{
      font-family:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .shell{
      width:min(1180px,calc(100% - 32px));
      margin:auto;
    }

    /* HEADER */

    .site-header{
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:50;
    }

    .header-inner{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
    }

    .brand-wrap{
      display:flex;
      flex-direction:column;
      gap:.1rem;
    }

    .brand{
      font-size:1rem;
      font-weight:800;
      letter-spacing:.04em;
    }

    .brand .tm{
      color:var(--gold);
      font-size:.55rem;
      vertical-align:super;
    }

    .brand-sub{
      font-size:.64rem;
      color:var(--ink-soft);
      direction:ltr;
      text-align:right;
    }

    .back-btn{
      background:transparent;
      border:1px solid var(--line);
      color:var(--ink-soft);
      padding:.6rem .9rem;
      border-radius:10px;
      font-size:.75rem;
      transition:.2s ease;
    }

    .back-btn:hover{
      border-color:var(--gold);
      color:var(--brown);
      transform:translateY(-1px);
    }

    /* PROGRESS */

    .workflow-wrap{
      background:var(--surface);
      border-bottom:1px solid var(--line);
    }

    .workflow{
      min-height:55px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      gap:.35rem;
      font-size:.69rem;
    }

    .workflow a{
      color:var(--ink-soft);
      padding:.35rem .55rem;
      border-radius:999px;
    }

    .workflow .done{
      color:var(--success);
    }

    .workflow .current{
      color:var(--brown);
      background:var(--gold-soft);
      border:1px solid var(--gold-line);
      font-weight:700;
    }

    .sep{
      color:#cfc4b7;
    }

    /* HERO */

    main{
      padding:2.7rem 0 5rem;
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(320px,.7fr);
      gap:1.6rem;
      align-items:start;
      margin-bottom:1.4rem;
    }

    .hero-copy{
      padding-top:.3rem;
    }

    .eyebrow{
      display:flex;
      align-items:center;
      gap:.6rem;
      color:var(--gold);
      font-size:.68rem;
      font-weight:700;
      margin-bottom:.7rem;
    }

    .eyebrow::before{
      content:"";
      width:30px;
      height:1px;
      background:var(--gold);
    }

    h1{
      font-size:clamp(2rem,4vw,3.5rem);
      line-height:1.25;
      max-width:740px;
      margin-bottom:.9rem;
      letter-spacing:-.03em;
    }

    .hero-desc{
      color:var(--ink-soft);
      font-size:.9rem;
      max-width:700px;
    }

    .hero
